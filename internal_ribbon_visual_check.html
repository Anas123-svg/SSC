<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Internal ribbon visual check</title>
<link rel="stylesheet" href="src/styles/word-template-v13.css"><link rel="stylesheet" href="src/styles/word-workspace-v14.css"><link rel="stylesheet" href="src/styles/word-workspace-v16.css"><link rel="stylesheet" href="src/styles/word-workspace-v17.css">
<style>body{margin:0;font:12px 'Segoe UI',Arial,sans-serif}.hxword{height:100vh}.hxword .hxword-stage{display:flex;justify-content:center}.paper{width:680px;background:white;min-height:800px;box-shadow:0 6px 30px #0002;padding:70px;font-size:14px}.paper h1{font-size:26px}.mock-tools{padding:8px;display:flex;align-items:center;gap:10px}.mock-tools span{padding:8px 12px;border-radius:6px;border:1px solid #e0e6df} .hxword .hxword-titlebar .brand{color:#cde682;font-size:16px;font-weight:800}.hxword-ribbon{display:flex;align-items:stretch}</style>
</head><body>
<div class="hxword">
<div class="hxword-titlebar"><div class="brand">HARMONIX</div><div class="hxword-title"><input value="HXC Site Compliance Audit" readonly><span>All changes saved</span></div><div class="hxword-title-actions"><button>Preview</button><button class="hxc-save">Save template</button><button>Full screen</button></div></div>
<nav class="hxword-menu" aria-label="Document editing menu"><div class="hxword-menu-scroller"><div class="hxword-tabs" role="tablist">
<button class="hxword-menu-tab is-file" role="tab">File</button><button class="hxword-menu-tab active" role="tab" aria-selected="true">Home</button><button class="hxword-menu-tab" role="tab">Insert</button><button class="hxword-menu-tab" role="tab">Layout</button><button class="hxword-menu-tab" role="tab">References</button><button class="hxword-menu-tab" role="tab">Review</button><button class="hxword-menu-tab" role="tab">View</button><button class="hxword-menu-tab" role="tab">Help</button></div></div><div class="hxword-menu-actions"><button class="hxword-ribbon-toggle">⌃ <span>Hide ribbon</span></button></div></nav>
<div class="hxword-ribbon"><div class="hxword-group"><div class="hxword-tools"><button>Cut</button><button>Copy</button><button>Paste</button></div><small>Clipboard</small></div><div class="hxword-group"><div class="hxword-tools"><label>Font<select><option>Aptos</option></select></label><label>Size<select><option>11</option></select></label><button><b>B</b></button><button><i>I</i></button><button><u>U</u></button></div><small>Font</small></div><div class="hxword-group"><div class="hxword-tools"><button>Align left</button><button>Align center</button><button>Bullets</button><button>Numbering</button></div><small>Paragraph</small></div><div class="hxword-group"><div class="hxword-tools"><button>Normal</button><button>Heading 1</button></div><small>Styles</small></div></div>
<div class="hxword-stage"><div class="paper"><h1>HXC Site Compliance Audit</h1><p>Inspection requirements and compliance documentation.</p><hr><h2>Section 1 — Project details</h2><p>Select any paragraph to edit formatting using the modern Word ribbon.</p></div></div>
</div></body></html>
